name: Magento 2 PHPStan
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened]
    branches:
      - master
      - release/**

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN }}

    strategy:
      matrix:
        include:
          - PHP_VERSION: php74-fpm
            MAGENTO_VERSION: 2.3.7-p4
          - PHP_VERSION: php82-fpm
            MAGENTO_VERSION: 2.4.6-p12

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: module-src

      - name: Start Docker
        run: docker run --detach --name magento-project-community-edition ghcr.io/controlaltdelete-nl/magento2-in-a-box/magento-project-community-edition:${{ matrix.PHP_VERSION }}-magento${{ matrix.MAGENTO_VERSION }}

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Pick repositories and branches
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          check_branch() {
            local OWNER="$1" REPO="$2" BRANCH="$3" DEFAULT="$4"
            local ENCODED_BRANCH STATUS
            ENCODED_BRANCH=$(jq -rn --arg b "$BRANCH" '$b|@uri')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/branches/$ENCODED_BRANCH")

            case "$STATUS" in
              200) echo "$BRANCH" ;;
              404) echo "$DEFAULT" ;;
              *)
                echo "Unexpected HTTP $STATUS when checking $OWNER/$REPO@$BRANCH" >&2
                exit 1
                ;;
            esac
          }

          CURRENT_REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          DEFAULT="master"
          ENCODED_BRANCH=$(jq -rn --arg b "$BRANCH" '$b|@uri')

          if [[ "$CURRENT_REPO" == *internal* ]]; then
            SDK_REPO="php-sdk-internal"
            CORE_REPO="magento2-internal-core"
          else
            SDK_REPO="php-sdk"
            CORE_REPO="magento2-core"
          fi

          SDK_BRANCH=$(check_branch "$OWNER" "$SDK_REPO" "$BRANCH" "$DEFAULT")
          CORE_BRANCH=$(check_branch "$OWNER" "$CORE_REPO" "$BRANCH" "$DEFAULT")

          echo "Selected current: $OWNER/$CURRENT_REPO@$BRANCH (encoded: $ENCODED_BRANCH)"
          echo "Selected sdk: $OWNER/$SDK_REPO@$SDK_BRANCH"
          echo "Selected core: $OWNER/$CORE_REPO@$CORE_BRANCH"

          {
            echo "module-package=multisafepay/magento2-adminhtml"
            echo "current-repo=$OWNER/$CURRENT_REPO"
            echo "sdk-repo=$OWNER/$SDK_REPO"
            echo "sdk-branch=$SDK_BRANCH"
            echo "core-repo=$OWNER/$CORE_REPO"
            echo "core-branch=$CORE_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout SDK repository
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.sdk-repo }}
          token: ${{ env.TOKEN }}
          ref: ${{ steps.pick.outputs.sdk-branch }}
          path: sdk-src

      - name: Checkout core repository
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.core-repo }}
          token: ${{ env.TOKEN }}
          ref: ${{ steps.pick.outputs.core-branch }}
          path: core-src

      - name: Copy package sources into container
        run: |
          docker exec magento-project-community-edition mkdir -p /data/package-source/multisafepay/magento2-adminhtml
          docker exec magento-project-community-edition mkdir -p /data/package-source/multisafepay/magento2-core
          docker exec magento-project-community-edition mkdir -p /data/package-source/multisafepay/php-sdk
          docker cp module-src/. magento-project-community-edition:/data/package-source/multisafepay/magento2-adminhtml
          docker cp core-src/. magento-project-community-edition:/data/package-source/multisafepay/magento2-core
          docker cp sdk-src/. magento-project-community-edition:/data/package-source/multisafepay/php-sdk

      - name: Add composer plugins
        run: docker exec --workdir /data magento-project-community-edition composer config --no-plugins allow-plugins true

      - name: Disable Composer audit blocking
        run: docker exec --workdir /data magento-project-community-edition composer config audit.block-insecure false

      - name: Add MultiSafepay packages to Composer
        run: docker exec --workdir /data magento-project-community-edition composer config repositories.multisafepay "path" "package-source/multisafepay/*"

      - name: Add module to composer
        run: docker exec --workdir /data magento-project-community-edition composer require ${{ steps.pick.outputs.module-package }}:@dev --no-update --no-interaction

      - name: Install PHPStan extension installer
        run: docker exec --workdir /data magento-project-community-edition composer require --dev phpstan/extension-installer --no-update --no-interaction

      - name: Install PHPStan Magento extension
        run: docker exec --workdir /data magento-project-community-edition composer require --dev bitexpert/phpstan-magento:0.32.0 --no-update --no-interaction

      - name: Install composer dependencies
        run: docker exec --workdir /data magento-project-community-edition composer update ${{ steps.pick.outputs.module-package }} multisafepay/magento2-core multisafepay/php-sdk phpstan/extension-installer bitexpert/phpstan-magento --with-all-dependencies --no-interaction

      - name: Run PHPStan
        run: docker exec --workdir /data magento-project-community-edition vendor/bin/phpstan analyse -c vendor/multisafepay/magento2-adminhtml/phpstan.neon --error-format table --no-progress
